<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
  <link rel="stylesheet" href="calculator.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>

  <div class="calculator">
    <div class="display">
      <div id="historyBox" class="history"></div>
      <div id="inputBox">0</div>
    </div>

    <div class="row">
      <button class="opr" data-action="clear">AC</button>
      <button class="opr" data-action="del">DEL</button>
      <button class="opr" data-value="%">%</button>
      <button class="opr" data-value="/">÷</button>
    </div>
    <div class="row">
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="opr" data-value="*">×</button>
    </div>
    <div class="row">
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="opr" id="plusBtn" data-value="+">+</button>
    </div>
    <div class="row">
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="opr" data-value="-">−</button>
    </div>
    <div class="row">
      <button class="opr" id="plusminus" data-action="sign">&#xB1;</button>
      <button data-value="0">0</button>
      <button data-value=".">,</button>
      <button class="opr" id="eqbtn" data-action="equals">=</button>
    </div>
  </div>


 <script src="calculator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
